id: "@ios-swift/rule-clarity-at-call-site"
kind: rule
version: "0.1.0"
description: "Code is read far more often than it is written. Every naming and signature decision — argument labels, method vs. free function, default values, presence or absence of a verb — must be evaluated by reading a sample call out loud and asking whether it reads like English documenting its own intent. Brevity in the declaration is not the goal; clarity at the use site is."
domain: ios-swift
