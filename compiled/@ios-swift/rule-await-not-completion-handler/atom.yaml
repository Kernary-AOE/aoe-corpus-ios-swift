id: "@ios-swift/rule-await-not-completion-handler"
kind: rule
version: "0.1.0"
description: "New async APIs are written as `func f(...) async throws -> T`. The call site reads as straight-line code, errors propagate through `try`, cancellation propagates through the cooperative cancellation system, and the structured-concurrency model (`Task`, `TaskGroup`, `async let`) composes naturally. Completion-handler APIs (`(Result<T, E>) -> Void` callbacks) are reserved for two cases: (1) wrapping platform APIs that have not yet adopted `async`, and (2) interop with Objective-C code that calls back via blocks."
domain: ios-swift
content_hash: "sha256:f054c38d58a9f4040dc12320b1aa3c484dc4a4f0892d5774381d88d09521bcc7"
